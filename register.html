<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

```
<main class="container">

    <section class="login-box">

        <div class="character">
            <img src="https://th.bing.com/th/id/OIP.OFKQnap0HetICjVQ0Ld4JQHaJ4?w=164&h=187&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3" alt="Solo Leveling character">
        </div>

        <header>
            <p class="system">SYSTEM</p>
            <h1>CREATE PLAYER</h1>
            <p>Begin your journey, Hunter.</p>
        </header>

        <form action="login.html" method="get">

            <div class="input-group">
                <label for="fullname">FULL NAME</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">EMAIL</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="username">USERNAME</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">PASSWORD</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="input-group">
                <label for="confirm-password">CONFIRM PASSWORD</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <label class="terms">
                <input type="checkbox" name="terms" required>
                I agree to the Terms and Conditions
            </label>

            <button type="submit">CREATE PLAYER</button>

        </form>

        <footer>
            <p>
                Already a Hunter?
                <a href="login.html">Return to Login</a>
            </p>
        </footer>

    </section>

</main>
```

</body>
</html>
