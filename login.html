<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling - Login</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <main class="container">

        <section class="login-box">

            <div class="character">
                <img src="https://th.bing.com/th/id/OIP.FJnumraGo1T6I1gRu5Bj1wHaEK?w=294&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3"
                     alt="Solo Leveling character">
            </div>

            <header>
                <p class="system">SYSTEM</p>
                <h1>PLAYER LOGIN</h1>
                <p>Welcome back, Hunter.</p>
            </header>

            <form id="loginForm">

                <!-- EMAIL -->
                <div class="input-group">

                    <label for="email">EMAIL</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >

                    <p class="error-message" id="emailError"></p>

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="password">PASSWORD</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                    >

                    <p class="error-message" id="passwordError"></p>

                </div>


                <!-- OPTIONS -->
                <div class="options">

                    <label>
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <!-- LOGIN ERROR -->
                <p class="error-message" id="loginMessage"></p>


                <!-- LOGIN BUTTON -->
                <button type="submit">ENTER SYSTEM</button>

            </form>


            <footer>

                <p>
                    New Hunter?
                    <a href="register.html">Create Account</a>
                </p>

            </footer>

        </section>

    </main>


    <!-- LOGIN JAVASCRIPT -->
    <script>

        const loginForm = document.getElementById("loginForm");

        const email = document.getElementById("email");
        const password = document.getElementById("password");

        const emailError = document.getElementById("emailError");
        const passwordError = document.getElementById("passwordError");
        const loginMessage = document.getElementById("loginMessage");


        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();


            // Clear previous errors
            emailError.textContent = "";
            passwordError.textContent = "";
            loginMessage.textContent = "";

            let hasError = false;


            /* ==============================
               CHECK EMAIL
            ============================== */

            if (email.value.trim() === "") {

                emailError.textContent = "ang email po ay required :>";
                hasError = true;

            }
            else {

                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailPattern.test(email.value.trim())) {

                    emailError.textContent = "please enter a valid email :>";
                    hasError = true;

                }

            }


            /* ==============================
               CHECK PASSWORD
            ============================== */

            if (password.value === "") {

                passwordError.textContent = "ang password po ay required :>";
                hasError = true;

            }


            /* ==============================
               STOP IF THERE IS AN ERROR
            ============================== */

            if (hasError) {
                return;
            }


            /* ==============================
               GET REGISTERED ACCOUNT
            ============================== */

            const savedAccount = JSON.parse(
                localStorage.getItem("soloLevelingAccount")
            );


            // No registered account
            if (!savedAccount) {

                loginMessage.textContent =
                    "no registered account found. please create an account :>";

                return;
            }


            /* ==============================
               CHECK EMAIL AND PASSWORD
            ============================== */

            if (
                email.value.trim().toLowerCase() !==
                savedAccount.email.toLowerCase()
            ) {

                loginMessage.textContent =
                    "email or password is incorrect :>";

                return;
            }


            if (password.value !== savedAccount.password) {

                loginMessage.textContent =
                    "email or password is incorrect :>";

                return;
            }


            /* ==============================
               LOGIN SUCCESS
            ============================== */

            alert("Login successful! Welcome, Hunter.");

            window.location.href = "../Activity2/index.html";

        });

    </script>

</body>
</html>
