
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling - Login</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <main class="container">

        <section class="login-box">

            <div class="character">
                <img src="https://th.bing.com/th/id/OIP.FJnumraGo1T6I1gRu5Bj1wHaEK?w=294&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3" alt="Solo Leveling character">
            </div>

            <header>
                <p class="system">SYSTEM</p>
                <h1>PLAYER LOGIN</h1>
                <p>Welcome back, Hunter.</p>
            </header>

            <form action="../Activity2/index.html" method="get">

                <div class="input-group">
                    <label for="email">EMAIL</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">ENTER SYSTEM</button>

            </form>

            <footer>
                <p>
                    New Hunter?
                    <a href="register.html">Create Account</a>
                </p>
            </footer>

        </section>

    </main>

</body>
</html>
